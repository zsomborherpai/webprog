<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>League of Legends — Champion Roster</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="brand">
        <span class="hex-icon">❖</span>
        <h1>CHAMPION MANAGER</h1>
      </div>

      <div id="auth-controls" class="auth-controls"></div>
    </header>

    <main class="container">
      <div id="guest-banner" class="banner">
        Viewing <strong>Public Champions</strong> as a Guest. Log in or register
        to create, edit, and manage your own champions.
      </div>

      <section id="editor-section" class="card editor-card hidden">
        <h2 id="form-title">Forge New Champion</h2>
        <form id="champion-form">
          <input type="hidden" id="champ-id" />

          <div class="form-grid">
            <div class="form-group">
              <label for="name">Champion Name</label>
              <input type="text" id="name" required />
            </div>

            <div class="form-group">
              <label for="title">Title / Epithet</label>
              <input type="text" id="title" required />
            </div>

            <div class="form-group">
              <label for="role">Primary Role</label>
              <select id="role">
                <option value="Assassin">Assassin</option>
                <option value="Fighter">Fighter</option>
                <option value="Mage">Mage</option>
                <option value="Marksman">Marksman</option>
                <option value="Support">Support</option>
                <option value="Tank">Tank</option>
              </select>
            </div>

            <div class="form-group">
              <label for="difficulty">Difficulty</label>
              <select id="difficulty">
                <option value="Low">Low</option>
                <option value="Moderate" selected>Moderate</option>
                <option value="High">High</option>
              </select>
            </div>

            <div class="form-group full-width">
              <label for="image_url">Image URL</label>
              <input type="url" id="image_url" />
            </div>

            <div class="form-group full-width">
              <label for="description">Lore / Notes</label>
              <textarea id="description" rows="2"></textarea>
            </div>

            <div class="form-group checkbox-group">
              <input type="checkbox" id="is_public" checked />
              <label for="is_public"
                >Public (visible to guests & other summoners)</label
              >
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-gold" id="submit-btn">
              Add Champion
            </button>
            <button
              type="button"
              class="btn btn-secondary hidden"
              id="cancel-edit-btn"
            >
              Cancel Edit
            </button>
          </div>
        </form>
      </section>

      <section class="toolbar">
        <div class="filters">
          <input
            type="text"
            id="search-input"
            placeholder="Search champions..."
          />
          <select id="role-filter">
            <option value="ALL">All Roles</option>
            <option value="Assassin">Assassin</option>
            <option value="Fighter">Fighter</option>
            <option value="Mage">Mage</option>
            <option value="Marksman">Marksman</option>
            <option value="Support">Support</option>
            <option value="Tank">Tank</option>
          </select>
          <label id="mine-only-wrapper" class="mine-toggle hidden">
            <input type="checkbox" id="mine-only-checkbox" /> My Champions Only
          </label>
        </div>
      </section>

      <section id="champions-grid" class="champions-grid"></section>
    </main>

    <div id="auth-modal" class="modal hidden">
      <div class="modal-content card">
        <span id="close-modal" class="close-btn">&times;</span>
        <h2 id="modal-title">Summoner Login</h2>
        <p id="auth-error" class="error-text hidden"></p>
        <form id="auth-form">
          <div class="form-group">
            <label for="auth-username">Username</label>
            <input type="text" id="auth-username" required />
          </div>
          <div class="form-group">
            <label for="auth-password">Password</label>
            <input type="password" id="auth-password" required />
          </div>
          <button
            type="submit"
            class="btn btn-gold full-btn"
            id="auth-submit-btn"
          >
            Login
          </button>
        </form>
        <p class="switch-auth">
          <span id="switch-text">New summoner?</span>
          <a href="#" id="switch-auth-mode">Create an account</a>
        </p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
